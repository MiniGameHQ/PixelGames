<!DOCTYPE html>
<html>
<head>
<title>GameHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎮 GameHub</h1>
<p>Play free mini games online!</p>

<input id="search" placeholder="Search games..." oninput="searchGames()">

<div class="games" id="games">

<div class="card" data-name="snake classic">
<h2>🐍 Snake</h2>
<p>Classic snake game</p>
<a href="snake.html">
<button>Play</button>
</a>
</div>

<div class="card" data-name="flappy bird flying">
<h2>🐤 Flappy</h2>
<p>Fly through the pipes and beat your best score!</p>
<a href="flappy.html">
<button>Play</button>
</a>
</div>

<div class="card" data-name="puzzle master brain">
<h2>🧩 Puzzle Master</h2>
<p>Test your brain</p>
<button>Play</button>
</div>

<div class="card premium" data-name="premium zone exclusive">
<h2>👑 Premium Zone</h2>
<p>Unlock exclusive games</p>
<button>Upgrade</button>
</div>

</div>

<script>
function searchGames() {
    const search = document.getElementById("search").value.toLowerCase();
    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        const name = card.dataset.name || card.innerText.toLowerCase();
        card.style.display = name.includes(search) ? "" : "none";
    });
}
</script>

</body>
</html>
